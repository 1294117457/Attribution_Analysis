# ============================================================
# Attribution Analysis — K8s 自动部署
# ============================================================
# 触发条件：push 到 k8s 分支，或在 Actions 页面手动运行
# 流程：构建 backend / frontend 镜像（tag = commit sha）→ 推送 ACR
#       → SSH 到 node1 → 对齐到本次提交 → envsubst 渲染 → kubectl apply
# 回滚：在 Actions 里重新运行旧提交对应的 workflow
# 前置：node1 仓库目录下有 deploy.env（不入 git，手动维护）
# postgres / redis 不在此流程中，手动部署
# ============================================================

name: K8s Build & Deploy

on:
  push:
    branches: [k8s]
  workflow_dispatch:

# 同一时间只跑一个部署，后来的排队
concurrency:
  group: k8s-deploy
  cancel-in-progress: false

# 必须与 node1 上 deploy.env 的 ACR_PREFIX 一致；ALIYUN_NAMESPACE 是旧 compose 部署用的，不能复用
env:
  IMAGE_PREFIX: ${{ secrets.ALIYUN_REGISTRY }}/zhouch0149

jobs:
  # ── 构建并推送镜像 ─────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build & Push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # ── 部署到 K8s（node1）──────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K8S_SSH_HOST }}
          username: ${{ secrets.K8S_SSH_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ${{ secrets.K8S_PROJECT_PATH }}

            # 对齐到本次提交（deploy.env 不入 git，reset 不会动它）
            git fetch origin k8s
            git reset --hard ${{ github.sha }}

            [ -f deploy.env ] || { echo "缺少 deploy.env"; exit 1; }
            source deploy.env
            export BACKEND_VERSION=${{ github.sha }}
            export FRONTEND_VERSION=${{ github.sha }}

            envsubst '${ACR_PREFIX} ${BACKEND_VERSION} ${TUSHARE_TOKEN} ${SMTP_USERNAME} ${SMTP_PASSWORD}' \
              < backend/k8s-backend.yaml | kubectl apply -f -
            envsubst '${ACR_PREFIX} ${FRONTEND_VERSION}' \
              < frontend/k8s-frontend.yaml | kubectl apply -f -

            kubectl -n attribution rollout status deploy/backend  --timeout=300s
            kubectl -n attribution rollout status deploy/frontend --timeout=300s
            kubectl -n attribution get pod -o wide
