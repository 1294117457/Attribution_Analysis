# kubeadm init 配置（参数化模板）
# 部署前请确认：
#   - source ../public/public.env  （设置 TAILSCALE_IP / NODE_NAME / K8S_VERSION / ACR_PREFIX 等）
#   - 用 envsubst 替换 ${VAR} 后 apply
# 注意：
#   1. 不要加任何 "node-labels" 字段，那是 kubectl label 的事，不是 kubeadm 的事
#   2. control-plane taint init 完会自动加，单节点集群需要后续 taint- 去掉
#   3. Tailscale 内网，advertiseAddress 必须写 Tailscale IP，不能写公网 IP
#   4. kubeadm-config.yaml 路径是 /etc/kubernetes/kubeadm-config.yaml，reset 会一起删
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: ${TAILSCALE_IP}        # Tailscale IP（所有节点互联靠这个）
  bindPort: 6443
nodeRegistration:
  name: ${NODE_NAME}                         # 主机 hostname，必须与 `hostname` 命令输出一致
  imagePullPolicy: IfNotPresent
  criSocket: unix:///run/containerd/containerd.sock
  kubeletExtraArgs:
    - name: node-ip
      value: "${TAILSCALE_IP}"              # kubelet 报告给 apiserver 的 IP，必须是 Tailscale IP
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: ${K8S_VERSION}
imageRepository: ${ACR_PREFIX}              # 控制平面组件镜像仓库（apiserver/etcd/scheduler/manager/coredns/kube-proxy）
networking:
  podSubnet: ${POD_SUBNET}                   # flannel 默认
  serviceSubnet: ${SERVICE_SUBNET}           # K8s 默认
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd                        # 必须和 containerd 一致（containerd SystemdCgroup = true）