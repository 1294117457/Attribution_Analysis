spring:
  # 本地开发环境 — 连接远程服务器 8.148.204.54
  datasource:
    url: jdbc:postgresql://8.148.204.54:5432/attribution
    username: zhouch
    password: zhouchenhui
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  data:
    redis:
      host: 8.148.204.54
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:}
      timeout: 5000
      connect-timeout: 5000
      lettuce:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 5
          max-wait: 2000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

tushare:
  token: ${TUSHARE_TOKEN:}
  base-url: http://api.tushare.pro

logging:
  level:
    com.attribution: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.data.redis: INFO
