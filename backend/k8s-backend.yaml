# Backend (FastAPI) — K8s 部署清单
#
# 部署（在仓库根目录）：
#   source deploy.env
#   envsubst '${ACR_PREFIX} ${BACKEND_VERSION} ${TUSHARE_TOKEN} ${SMTP_USERNAME} ${SMTP_PASSWORD}' \
#     < backend/k8s-backend.yaml | kubectl apply -f -
#   只改了 ConfigMap / Secret 时，apply 后还需：kubectl -n attribution rollout restart deploy/backend
#
# 配置来源（不要在 Headlamp 里直接改 ConfigMap/Secret，下次部署会被覆盖）：
#   - 普通配置 → 本文件 ConfigMap backend-config（入 git）
#   - 密码     → deploy.env 渲染到 Secret backend-secret（deploy.env 不入 git）
#   - DATABASE_URL / REDIS_URL → Deployment env 里用 postgres-secret / redis-secret 拼接，密码只存一份
#   - backend/.env 只给本地开发用，与集群无关
#
# 卸载：
#   kubectl -n attribution delete deploy/backend svc/backend configmap/backend-config secret/backend-secret
#
# 前置条件：
#   - postgres / redis 已部署（同 namespace，Service 名 postgres / redis，Secret 名 postgres-secret / redis-secret）
#   - 镜像已推送到 ACR：${ACR_PREFIX}/backend:${BACKEND_VERSION}
#
# 注意：
#   - 镜像内无 .env（.dockerignore 已排除），配置全部来自环境变量
#   - 密码若含 @ : / ? # 等字符，需 URL 编码后才能拼进连接串

---
# ===== ConfigMap: 普通配置 =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: attribution
data:
  DEBUG: "false"
  API_V1_PREFIX: "/api/v1"
  # 定时采集（进程内 APScheduler）
  COLLECT_SCHEDULER_ENABLED: "true"
  COLLECT_SCHEDULER_TIMEZONE: "Asia/Shanghai"
  # 邮件 SMTP（邮箱注册验证码）
  SMTP_HOST: "smtp.qq.com"
  SMTP_PORT: "465"
  SMTP_USE_SSL: "true"
  SMTP_FROM: ""
  SMTP_SUBJECT_PREFIX: "[归因分析]"
  # 系统账号白名单（英文逗号分隔，不受验证码限流）
  SYSTEM_ACCOUNTS: "zch"

---
# ===== Secret: 密码，值来自 deploy.env =====
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: attribution
type: Opaque
stringData:
  TUSHARE_TOKEN: "${TUSHARE_TOKEN}"
  SMTP_USERNAME: "${SMTP_USERNAME}"
  SMTP_PASSWORD: "${SMTP_PASSWORD}"

---
# ===== Service: 名字必须是 backend（frontend/nginx.conf 里 proxy_pass http://backend:8000）=====
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: attribution
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP

---
# ===== Deployment =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: attribution
  labels:
    app: backend
spec:
  # 进程内跑 APScheduler 定时采集，多副本会重复执行，只能 1 个
  replicas: 1
  # 先停旧 Pod 再起新 Pod，避免滚动更新期间两个调度器同时运行
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ${ACR_PREFIX}/backend:${BACKEND_VERSION}
        # 兼容 latest 标签：每次启动都向 ACR 校验 digest，镜像没变不会重复下载
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        # env 优先级高于 envFrom；$(VAR) 只能引用列在它前面的变量
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: { name: postgres-secret, key: POSTGRES_USER }
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD }
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef: { name: postgres-secret, key: POSTGRES_DB }
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef: { name: redis-secret, key: REDIS_PASSWORD }
        - name: DATABASE_URL
          value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        # 启动期最多等 150s（数据库未就绪、首次导入较慢时不被误杀）
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
