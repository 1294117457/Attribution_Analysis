# Backend (FastAPI) — K8s 部署清单
#
# 部署：
#   cd /home/project/Attribution_Analysis
#   source deploy.env
#   envsubst '${ACR_PREFIX} ${BACKEND_VERSION} ${POSTGRES_USER} ${POSTGRES_PASSWORD} ${POSTGRES_DB} ${REDIS_PASSWORD} ${TUSHARE_TOKEN} ${SMTP_USERNAME} ${SMTP_PASSWORD} ${SYSTEM_ACCOUNTS}' < backend/k8s-backend.yaml | kubectl apply -f -
#
# 改了 ConfigMap / Secret 后需重启才生效（环境变量只在容器启动时读取）：
#   kubectl -n attribution rollout restart deploy/backend
#
# 卸载：
#   kubectl -n attribution delete deploy/backend svc/backend configmap/backend-config secret/backend-secret
#
# 前置条件：
#   - postgres / redis 已部署（同 namespace，Service 名 postgres / redis）
#   - 镜像已推送到 ACR：${ACR_PREFIX}/backend:${BACKEND_VERSION}
#
# 注意：
#   - 镜像内无 .env（.dockerignore 已排除），全部配置走下面的 ConfigMap / Secret
#   - 密码若含 @ : / ? # 等字符，需 URL 编码后才能拼进连接串

---
# ===== Secret: 敏感配置 =====
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: attribution
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  TUSHARE_TOKEN: "${TUSHARE_TOKEN}"
  SMTP_USERNAME: "${SMTP_USERNAME}"
  SMTP_PASSWORD: "${SMTP_PASSWORD}"

---
# ===== ConfigMap: 普通配置 =====
# 未列出的项使用 settings.py 默认值
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: attribution
data:
  DEBUG: "false"
  API_V1_PREFIX: /api/v1
  COLLECT_SCHEDULER_ENABLED: "true"
  COLLECT_SCHEDULER_TIMEZONE: Asia/Shanghai
  SMTP_HOST: smtp.qq.com
  SMTP_PORT: "465"
  SMTP_USE_SSL: "true"
  SYSTEM_ACCOUNTS: "${SYSTEM_ACCOUNTS}"

---
# ===== Service: 名字必须是 backend（frontend/nginx.conf 里 proxy_pass http://backend:8000）=====
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: attribution
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP

---
# ===== Deployment =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: attribution
  labels:
    app: backend
spec:
  # 进程内跑 APScheduler 定时采集，多副本会重复执行，只能 1 个
  replicas: 1
  # 先停旧 Pod 再起新 Pod，避免滚动更新期间两个调度器同时运行
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ${ACR_PREFIX}/backend:${BACKEND_VERSION}
        # 兼容 latest 标签：每次启动都向 ACR 校验 digest，镜像没变不会重复下载
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        # 启动期最多等 150s（数据库未就绪、首次导入较慢时不被误杀）
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
